# goreleaser config for hugin-agent.
# Cross-builds the single static binary for the platforms we care about,
# uploads to GitHub Releases. CGO disabled — pure Go, runs anywhere.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: hugin-agent
    main: ./cmd/hugin-agent
    binary: hugin-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

# Homebrew tap auto-publish.
#
# Requires `HOMEBREW_TAP_GITHUB_TOKEN` repo secret on hugin-agent — a
# fine-grained PAT (or GitHub App installation token) with
# `contents: write` on both `srcfl/homebrew-tap` and
# `srcfl/scoop-bucket`. One token covers both publishers because the
# accounts live in the same org.
brews:
  - name: hugin-agent
    repository:
      owner: srcfl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/srcfl/hugin-agent"
    description: "Thin local agent for Hugin — scans LAN, talks Modbus, runs Lua drivers"
    license: "MIT"
    install: |
      bin.install "hugin-agent"
    test: |
      system "#{bin}/hugin-agent", "--help"
    commit_author:
      name: srcfl-release-bot
      email: release-bot@sourceful.energy
    commit_msg_template: "hugin-agent: bump to {{ .Tag }}"

# Scoop bucket auto-publish. Same token as the brew tap.
scoops:
  - name: hugin-agent
    repository:
      owner: srcfl
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/srcfl/hugin-agent"
    description: "Thin local agent for Hugin — scans LAN, talks Modbus, runs Lua drivers"
    license: "MIT"
    commit_author:
      name: srcfl-release-bot
      email: release-bot@sourceful.energy
    commit_msg_template: "hugin-agent: bump to {{ .Tag }}"
